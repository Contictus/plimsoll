version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - revive
    - bodyclose
    - noctx

  settings:
    depguard:
      rules:
        # Domain packages must reach the database through tenancy.InTx, never by taking a
        # connection from the pool themselves (K15, L12). Enforced by a lint rule rather
        # than by convention, because a convention is what gets forgotten at 2am.
        no-direct-pool-in-domain:
          files:
            - "**/internal/auth/**"
            - "**/internal/httpapi/**"
            - "**/internal/position/**"
            - "**/internal/projection/**"
            - "**/internal/valuation/**"
            - "**/internal/pnl/**"
            - "**/internal/risk/**"
          deny:
            - pkg: "github.com/jackc/pgx/v5/pgxpool"
              desc: "use tenancy.InTx; a domain package must not hold a pool"

        # Engines are pure functions: no clock, no logger, no network (L4). Time and
        # prices are inputs, which is what makes scenario shocks and historical
        # reconstruction cheap.
        no-io-in-engines:
          files:
            - "**/internal/position/**"
            - "**/internal/valuation/**"
            - "**/internal/pnl/**"
            - "**/internal/risk/**"
          deny:
            - pkg: "net/http"
              desc: "engines are pure (L4): no network"
            - pkg: "log/slog"
              desc: "engines are pure (L4): no logger"
            - pkg: "github.com/jackc/pgx/v5"
              desc: "engines are pure (L4): no database"

        # The limiter decides when a call may go out; it never makes one. Keeping the
        # network out of it is what lets the whole priority and penalty machinery be
        # tested with an injected clock and no server (K24, L4).
        ratelimit-decides-but-never-calls:
          files:
            - "**/internal/ratelimit/**"
          deny:
            - pkg: "net/http"
              desc: "the limiter authorises a call, it does not make one"
            - pkg: "github.com/jackc/pgx/v5"
              desc: "the limiter holds no database"
            - pkg: "log/slog"
              desc: "the limiter has no logger; the caller reports what it did"

        # The ledger is the one module that both owns writes and is named by L4. It gets a
        # rule of its own rather than an exception to the engines rule: production code may
        # hold a transaction-scoped *store.Queries handed to it by tenancy.InTx, but never
        # a pool, a clock, a logger or the driver itself. Its integration tests are
        # excluded, because the laws they prove -- append-only privileges, the composite FK
        # -- live in Postgres and cannot be reached from Go without pgx.
        ledger-holds-a-transaction-not-a-driver:
          files:
            - "**/internal/ledger/**"
            - "!**/*_test.go"
          deny:
            - pkg: "net/http"
              desc: "the ledger does not reach the network (L4)"
            - pkg: "log/slog"
              desc: "the ledger does not log (L4)"
            - pkg: "github.com/jackc/pgx/v5"
              desc: "take a *store.Queries from tenancy.InTx, not the driver"
            - pkg: "github.com/jackc/pgx/v5/pgxpool"
              desc: "the ledger must not hold a pool; tenancy.InTx owns the transaction"

# gofmt runs as a formatter so `make lint` reports drift instead of leaving it to a
# reviewer's eye. It also catches CRLF, which sneaks in from Windows editors and shows up
# as a whole-file diff in git.
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
