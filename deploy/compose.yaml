name: plimsoll

# The only host ports published are the ones a human uses: caddy (the single origin),
# jaeger's UI, and postgres for migrations and the integration suite. The api and the
# worker are reachable only on the compose network, so K27's same-origin claim is a fact
# about the topology rather than a convention (deploy/smoke.sh checks it).

x-backend-env: &backend-env
  PLIMSOLL_APP_DSN: postgres://plimsoll_app:${PLIMSOLL_APP_PASSWORD}@postgres:5432/plimsoll?sslmode=disable
  PLIMSOLL_MASTER_KEK: ${PLIMSOLL_MASTER_KEK}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      PLIMSOLL_OWNER_PASSWORD: ${PLIMSOLL_OWNER_PASSWORD}
      PLIMSOLL_APP_PASSWORD: ${PLIMSOLL_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plimsoll"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations run before anything that reads the schema, as a one-shot the other services
  # wait on. Without it a clean machine brought the stack up, started the worker against an
  # empty database, and watched it exit on a function that did not exist yet -- a failure
  # that named a missing function rather than the missing step.
  #
  # It runs plimsollctl, which carries the migrations embedded in its own binary, so the
  # image and the schema it applies cannot be different revisions of each other.
  migrate:
    build:
      context: ../backend
      args:
        CMD: plimsollctl
    command: ["migrate"]
    environment:
      # The owner role, never the app role: migrations are DDL (K15).
      PLIMSOLL_OWNER_DSN: postgres://plimsoll_owner:${PLIMSOLL_OWNER_PASSWORD}@postgres:5432/plimsoll?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      args:
        CMD: api
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: plimsoll-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy
    healthcheck:
      # The distroless image has no shell and no curl, so the binary probes itself. Only
      # 200 counts, and /healthz answers 503 when Postgres is unreachable -- the container
      # goes unhealthy with its database, which is the behaviour an operator needs.
      test: ["CMD", "/plimsoll", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ../backend
      args:
        CMD: worker
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: plimsoll-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy

  # The dashboard (K27). It serves pages and never talks to Postgres: every number on every
  # screen arrives through /api, which is what keeps one description of the data and one place
  # where tenancy is decided.
  frontend:
    build:
      context: ../frontend
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${CADDY_HOST_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
